<!doctype html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TennisVideoHub{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17211c;
            --muted: #607067;
            --line: #dfe8e1;
            --surface: #ffffff;
            --wash: #f3f8f4;
            --brand: #176b45;
            --brand-dark: #0f4f32;
            --danger: #a32929;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: linear-gradient(145deg, #eef7ef 0%, #f8faf8 45%, #edf4f0 100%);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }
        header {
            background: rgba(255, 255, 255, .92);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(12px);
        }
        .nav, main { width: min(920px, calc(100% - 32px)); margin: 0 auto; }
        .nav { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand { color: var(--brand-dark); font-size: 1.1rem; font-weight: 800; text-decoration: none; letter-spacing: -.02em; }
        .account { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .92rem; }
        main { padding: 48px 0 72px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(25, 70, 45, .09);
            padding: clamp(24px, 5vw, 44px);
        }
        .eyebrow { color: var(--brand); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 8px 0 10px; font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.08; letter-spacing: -.04em; }
        .lede { color: var(--muted); font-size: 1.02rem; line-height: 1.7; margin: 0 0 30px; }
        .field { margin: 0 0 24px; }
        label, legend { display: block; font-weight: 750; margin-bottom: 8px; }
        input[type="text"], input[type="password"], input[type="number"], input[type="file"], select {
            width: 100%; border: 1px solid #bdcbc1; border-radius: 10px; background: white;
            padding: 12px 14px; color: var(--ink); font: inherit;
        }
        input:focus, select:focus { outline: 3px solid rgba(23, 107, 69, .15); border-color: var(--brand); }
        ul { padding-left: 20px; }
        .choice-list ul, ul[id^="id_"] { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 10px 18px; }
        .choice-list li, ul[id^="id_"] li { margin: 0; }
        .choice-list label, ul[id^="id_"] label { font-weight: 500; margin: 0; display: flex; align-items: center; gap: 7px; }
        .help { color: var(--muted); font-size: .86rem; margin-top: 7px; line-height: 1.5; }
        .errors, .errorlist { color: var(--danger); margin: 8px 0 0; font-size: .9rem; }
        .button {
            appearance: none; border: 0; border-radius: 11px; background: var(--brand); color: white;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            font: inherit; font-weight: 750; padding: 12px 20px; text-decoration: none;
        }
        .button:hover { background: var(--brand-dark); }
        .button.secondary { background: transparent; color: var(--brand-dark); border: 1px solid #bdcbc1; }
        .button.small { padding: 8px 12px; font-size: .88rem; }
        .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
        .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 26px 0; }
        .meta-item { background: var(--wash); border-radius: 12px; padding: 14px; }
        .meta-label { color: var(--muted); font-size: .78rem; margin-bottom: 4px; }
        .meta-value { font-weight: 700; }
        video { width: 100%; max-height: 560px; background: #0b0f0d; border-radius: 14px; display: block; }
        form.inline { display: inline; }
        @media (max-width: 560px) {
            main { padding-top: 24px; }
            .nav { align-items: flex-start; padding: 16px 0; flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav" aria-label="主导航">
            <a class="brand" href="{% url 'videos:home' %}">TennisVideoHub</a>
            {% if user.is_authenticated %}
                <div class="account">
                    <span>{{ user.username }}</span>
                    <form class="inline" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="button secondary small" type="submit">退出登录</button>
                    </form>
                </div>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
